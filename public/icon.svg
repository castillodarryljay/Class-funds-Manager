<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#047857" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Premium White Canvas Frame with mathematically calculated corner radius -->
  <rect width="512" height="512" rx="128" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Core Emblem Background -->
  <rect x="96" y="96" width="320" height="320" rx="80" fill="url(#emeraldGrad)" filter="url(#softShadow)" />

  <!-- Integrated Cap & Shield Graphic -->
  <g fill="#ffffff" transform="translate(144, 136)">
    <!-- Graduation Cap Mortarboard (top) -->
    <path d="M 112 16 L 208 60 L 112 104 L 16 60 Z" />
    <!-- Tassel -->
    <path d="M 188 72 L 200 120 C 201 124 198 128 194 128 C 190 128 187 124 186 120 Z" opacity="0.85" />
    
    <!-- Shield / Vault Body below mortarboard -->
    <path d="M 52 90 L 52 144 C 52 188 112 216 112 216 C 112 216 172 188 172 144 L 172 90 Z" />
    
    <!-- Dollar Sign Emblem embedded in shield -->
    <path d="M 112 108 C 102 108 96 113 96 120 C 96 132 128 128 128 144 C 128 151 122 156 112 156 C 101 156 97 151 96 146 M 112 102 L 112 162" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
</svg>
