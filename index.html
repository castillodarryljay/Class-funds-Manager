<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClassFund Manager</title>
    <meta name="description" content="Premium, secure classroom financial manager & student receipt book." />
    <meta name="theme-color" content="#10b981" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="ClassFund Manager" />
    <meta property="og:description" content="Premium, secure classroom financial manager & student receipt book." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            for (let registration of registrations) {
              registration.update();
            }
          });
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registered:', reg.scope))
            .catch((err) => console.error('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
