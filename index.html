  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Premium, secure classroom financial manager & student receipt book." />
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ClassFund" />
    <link rel="icon" type="image/png" href="/LogoIcon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon.png" />
    <link rel="shortcut icon" href="/LogoIcon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta property="og:title" content="ClassFund Manager" />
    <meta property="og:description" content="Premium, secure classroom financial manager & student receipt book." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Immediate registration of Service Worker for Chrome PWA Installation criteria
      if ('serviceWorker' in navigator) {
        function registerSW() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('ClassFund PWA ServiceWorker active:', reg.scope);
            })
            .catch(function(err) {
              console.log('ServiceWorker registration note:', err);
            });
        }
        if (document.readyState === 'complete') {
          registerSW();
        } else {
          window.addEventListener('load', registerSW);
        }
      }
    </script>
  </body>
</html>
